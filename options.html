<!doctype html>
<html><head><meta charset="utf-8"><title>Bank to Wallet Sync settings</title><link rel="stylesheet" href="style.css">
<style>
  body { max-width: 520px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 18px; }
  label { display: block; font-weight: 600; margin: 18px 0 6px; }
  input, select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background-color: var(--paper); }
  .row { display: flex; gap: 8px; } .row select { flex: 1; }
  p.hint { margin: 6px 0 0; font-size: 12px; }
  .save { margin-top: 22px; }
</style></head>
<body>
  <h1>Settings</h1>

  <label for="token">Wallet API token</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false">
  <p class="hint muted">Generate it in Wallet web app → Settings → REST API (needs Premium). Stored only in this browser's extension storage.</p>

  <label for="account">Wallet account to add transactions to</label>
  <div class="row"><select id="account"><option value="">Load accounts first</option></select><button id="load">Load accounts</button></div>

  <label for="currency">Currency</label>
  <input id="currency" maxlength="3">

  <div class="save"><button class="primary" id="save">Save settings</button></div>
  <p class="status" id="status"></p>
  <script type="module" src="options.js"></script>
</body></html>
