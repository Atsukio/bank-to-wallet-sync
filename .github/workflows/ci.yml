name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Build the Web Store zip
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
