<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Bank to Wallet Sync</title><link rel="stylesheet" href="style.css">
<style>
  body { padding: 14px; min-width: 280px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: -4px -6px 12px 0; }
  h1 { margin: 0; line-height: 0; }
  h1 img { image-rendering: pixelated; } /* the icon is pixel art: keep it crisp when scaled down */
  /* compact buttons for the narrow panel (the shared style.css sizes suit the roomier Settings page) */
  button { min-height: 24px; padding: 4px 12px; font-size: 13px; line-height: 18px; border-radius: 16px; } /* 24px: the smallest target WCAG 2.2 allows */
  button.icon-btn { width: 36px; height: 36px; padding: 0; }
  .actions button { padding: 6px 14px; }
  .demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; padding: 6px 6px 6px 12px; border-radius: 12px; background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); font-size: 14px; line-height: 20px; letter-spacing: .25px; }
  .demo-bar button { flex: none; color: inherit; }
  .account-info { margin: 0 0 4px; }
  .account-info p { margin: 0; }
  #account { font-weight: 500; letter-spacing: .1px; color: var(--md-on-surface); }
  select.acct { width: 100%; margin: 0 0 8px; padding: 6px 10px; font-weight: 500; letter-spacing: .1px; border: 1px solid var(--md-outline); border-radius: 8px; background-color: var(--md-surface); color: var(--md-on-surface); }
  /* a long account name is shortened with "…" but the last digits always stay visible; the full text is the tooltip */
  #bank { display: flex; gap: 4px; font-size: 14px; line-height: 20px; letter-spacing: .25px; color: var(--md-on-surface-variant); white-space: nowrap; }
  #bankLabel { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #bankDigits { flex: none; }
  /* Wallet | Bank side by side; subgrid keeps label, amount and verdict/Adjust rows level across the divider */
  .balances { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
  .balances[hidden], .side[hidden] { display: none; }
  .side { display: grid; grid-row: span 3; grid-template-rows: subgrid; align-items: center; justify-items: start; min-width: 0; }
  /* the divider runs beside the label and amount only, not the verdict/Adjust row */
  .side.bank > .lbl, .side.bank > .amount { align-self: stretch; border-left: 1px solid var(--md-outline-variant); padding-left: 12px; }
  .side .lbl { font-size: 12px; line-height: 16px; letter-spacing: .5px; font-weight: 500; color: var(--md-on-surface-variant); }
  .side .amount { font-size: 16px; line-height: 24px; letter-spacing: .15px; font-weight: 500; }
  #balance { color: var(--md-secondary); }
  #bankLine { color: var(--md-tertiary); }
  #reconcileText { font-size: 14px; line-height: 20px; letter-spacing: .25px; }
  #adjust { margin-left: 4px; } /* its text lines up with the bank column's (12px in, less the button's 8px padding) */
  .access { margin: 8px 0; padding: 10px 12px; border-radius: 12px; background: var(--md-surface-container-high); font-size: 14px; line-height: 20px; letter-spacing: .25px; }
  .access p { margin: 0 0 8px; }
  .verdict { font-weight: 500; }
  .verdict.ok { color: var(--credit); }
  .verdict.up { color: var(--credit); }
  .verdict.down { color: var(--md-error); }
  /* the summary above the list, coloured like the row chips it counts */
  .s-new { color: var(--md-primary); font-weight: 500; }
  .s-likely { color: var(--md-tertiary); }
  .s-check { color: var(--md-error); }
  .s-warn { color: var(--warn); }
  .why { margin: 2px 0 0; font-size: 14px; line-height: 20px; letter-spacing: .25px; }
  .adjust-confirm { margin: 6px 0; padding: 10px 12px; border-radius: 12px; background: var(--md-surface-container-high); font-size: 14px; line-height: 20px; letter-spacing: .25px; }
  .adjust-confirm p { margin: 0 0 8px; }
  .adjust-actions { display: flex; gap: 8px; }
  .date { color: var(--md-secondary); }
  .cat { color: var(--md-tertiary); }
  .cat.none { color: var(--warn); }
  .unsure { color: var(--md-error); }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions .grow { flex: 1; }
  .status-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .status-row .status { flex: 1; }
  .status-row button { flex: none; padding: 4px 12px; font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--md-outline-variant); }
  li { display: grid; grid-template-columns: 18px 1fr auto; column-gap: 12px; row-gap: 2px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--md-outline-variant); }
  li input[type=checkbox], #toggleAll { width: 18px; height: 18px; margin: 0; } /* M3 checkbox size; the browser's 13px is hard to hit */
  #toggleAll { vertical-align: -4px; }
  li input[type=checkbox]:disabled { opacity: .38; } /* M3 disabled: tells settled rows from ones you can tick */
  li input[type=checkbox] { grid-row: 1 / span 2; align-self: center; }
  .sub { grid-column: 2 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 14px; line-height: 20px; letter-spacing: .25px; }
  /* settled rows are muted with M3's variant text colour, not opacity, so they stay readable (4.5:1) */
  li.done :is(.desc, .amt, .date, .cat, .unsure), li.ignored :is(.desc, .amt, .date, .cat, .unsure),
  li.likely :is(.desc, .date) { color: var(--md-on-surface-variant); }
  .match { grid-column: 2 / -1; font-size: 14px; line-height: 20px; letter-spacing: .25px; margin-top: -4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .match span { overflow-wrap: anywhere; }
  .match > span:first-child { flex: 1; } /* the text takes the room, so several buttons sit together on the right */
  .match button { padding: 2px 12px; font-size: 13px; flex: none; }
  .acts { grid-column: 2 / -1; display: flex; gap: 4px; margin: -2px 0 0 -8px; }
  button.text { border: none; padding: 2px 8px; font-size: 13px; border-radius: 16px; }
  button.text.confirm { color: var(--md-error); } /* the second click deletes */
  select.mini { max-width: 60%; padding: 2px 6px; font-size: 13px; border: 1px solid var(--md-outline); border-radius: 8px; background-color: var(--md-surface); color: var(--md-on-surface); }
  #coverage { margin: 0 0 8px; font-size: 14px; line-height: 20px; letter-spacing: .25px; }
  .desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amt { font-variant-numeric: tabular-nums; text-align: right; }
  .amt.neg { color: var(--md-error); } .amt.pos { color: var(--credit); }
  .amt.xfer { color: var(--md-tertiary); } /* a transfer is neither spending nor income */
  .bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; }
  /* A long list scrolls between the two: the select-all bar with the bulk buttons stays at the top and
     "Add to Wallet" at the bottom of the panel. They span the body's 14px padding so rows don't show beside them. */
  #results > .bar { position: sticky; top: 0; z-index: 1; margin: 4px -14px 0; padding: 6px 14px; background: var(--md-surface); border-bottom: 1px solid var(--md-outline-variant); }
  #results > .actions { position: sticky; bottom: 0; z-index: 1; margin: 0 -14px; padding: 10px 14px 14px; background: var(--md-surface); border-top: 1px solid var(--md-outline-variant); }
  #results > #list { border-top: 0; }
  pre { max-height: 220px; overflow: auto; font-size: 13px; background: var(--md-surface-container-high); padding: 12px; border-radius: 12px; }
  /* busy state (see setBusy in popup.js): an M3 indeterminate linear progress bar, a spinner on the pressed button,
     and the rest of the panel dimmed and inert while a user-started action runs */
  .progress { position: sticky; top: 0; z-index: 2; height: 4px; margin: -14px -14px 10px; background: var(--md-secondary-container); overflow: hidden; }
  .progress::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 2px; background: var(--md-primary); animation: b2w-slide 1.1s ease-in-out infinite; }
  @keyframes b2w-slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  @keyframes b2w-spin { to { transform: rotate(360deg); } }
  button.pending::before { content: ""; display: inline-block; width: 11px; height: 11px; margin: -2px 6px 0 -2px; vertical-align: middle; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: b2w-spin .8s linear infinite; }
  #app[inert] button:not(.pending), #app[inert] select, #app[inert] input { opacity: .45; }
  @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; width: 100%; opacity: .5; } button.pending::before { animation-duration: 2.4s; } }
  [hidden] { display: none !important; }
</style></head>
<body>
  <div class="progress" id="progress" role="progressbar" aria-label="Working" hidden></div>
  <main id="app">
  <header>
    <h1><img src="icons/icon-128.png" width="32" height="32" alt="Bank to Wallet Sync" title="Bank to Wallet Sync"></h1>
    <button class="icon-btn" id="openSettings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg></button>
  </header>
  <section class="whats-new" id="whatsNew" aria-label="What's new" hidden></section>
  <div class="demo-bar" id="demoBar" hidden>
    <span>Demo mode: fake accounts and data. Nothing is sent to Wallet.</span>
    <button id="exitDemo" class="text">Exit demo</button>
  </div>
  <div class="account-info">
    <select id="accountSelect" class="acct" aria-label="Wallet account to add to" hidden></select>
    <p id="account">No account set</p>
    <p id="bank" hidden><span id="bankLabel"></span><span id="bankDigits"></span></p>
    <div class="balances" id="balances" hidden>
      <div class="side">
        <span class="lbl" id="walletLbl">Wallet</span>
        <span class="amount" id="balance"></span>
        <span id="reconcileText" hidden></span>
      </div>
      <div class="side bank" id="reconcile" hidden>
        <span class="lbl">Bank</span>
        <span class="amount" id="bankLine"></span>
        <button id="adjust" class="text" title="Add one record for the difference so Wallet's balance matches the bank's">Adjust</button>
      </div>
    </div>
    <div class="muted why" id="reconcileWhy" hidden></div>
    <div class="adjust-confirm" id="adjustConfirm" hidden>
      <p id="adjustText"></p>
      <div class="adjust-actions"><button class="primary" id="adjustYes">Add adjustment</button><button id="adjustNo">Cancel</button></div>
    </div>
  </div>

  <div class="actions"><button class="primary grow" id="read">Read transactions on this page</button><button id="demo" title="Dummy transactions, no login or Wallet token needed">Demo data</button></div>
  <div class="access" id="access" hidden><p id="accessText"></p><button class="primary" id="allowBank"></button></div>
  <div class="status-row"><p class="status" id="status"></p><button id="undo" hidden title="Delete the records the last Add created">Undo last add</button></div>

  <section id="results" hidden>
    <p class="muted" id="coverage"></p>
    <div class="bar">
      <label><input type="checkbox" id="toggleAll" checked> <span id="count"></span></label>
      <span><button id="moveAll" hidden title="Move every Wallet record dated a few days before or after the bank to the bank's date">Use bank dates</button> <button id="fixAll" hidden title="Correct the type of every Wallet record that is recorded with the opposite type">Fix types</button> <button id="mergeAll" hidden title="On every likely match: keep the Wallet note and add the bank's description to it">Merge notes</button> <button id="replaceAll" hidden title="On every likely match: replace the Wallet note with the bank's description">Replace notes</button> <button id="clear" hidden title="Forget the pages collected so far">Clear list</button> <button id="compare" title="Show how Wallet's records and the bank's were read">Compare</button> <button id="preview">Preview payload</button></span>
    </div>
    <ul id="list"></ul>
    <div class="actions"><button class="primary grow" id="sync">Add to Wallet</button></div>
    <pre id="payload" hidden></pre>
  </section>
  </main>

  <script type="module" src="popup.js"></script>
</body></html>
