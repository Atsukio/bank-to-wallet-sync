<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
  body { padding: 14px; min-width: 280px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  h1 { font-size: 15px; margin: 0; }
  .account { font-size: 12px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions .grow { flex: 1; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li { display: grid; grid-template-columns: 18px 74px 1fr auto; gap: 8px; align-items: center; padding: 7px 2px; border-bottom: 1px solid var(--line); }
  li.done { opacity: .5; }
  li.likely .desc, li.likely .muted { opacity: .7; }
  .match { grid-column: 2 / -1; font-size: 12px; margin-top: -4px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .match span { overflow-wrap: anywhere; }
  .match button { padding: 2px 8px; font-size: 11px; flex: none; }
  #coverage { margin: 0 0 8px; font-size: 12px; }
  .desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .amt { font-variant-numeric: tabular-nums; text-align: right; }
  .amt.neg { color: var(--debit); } .amt.pos { color: var(--credit); }
  .tag { font-size: 11px; color: var(--muted); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 6px; }
  pre { max-height: 220px; overflow: auto; font-size: 11px; background: color-mix(in srgb, var(--line) 35%, transparent); padding: 8px; border-radius: 6px; }
  [hidden] { display: none !important; }
</style></head>
<body>
  <header>
    <h1>Bank to Wallet Sync <span class="muted tag">Supports M2U</span></h1>
    <span class="account muted"><span id="account">No account set</span> · <a href="#" id="openSettings">Settings</a></span>
  </header>

  <div class="actions"><button class="primary grow" id="read">Read transactions on this page</button><button id="demo" title="Dummy transactions, no login or Wallet token needed">Demo data</button></div>
  <p class="status" id="status"></p>

  <section id="results" hidden>
    <p class="muted" id="coverage"></p>
    <div class="bar">
      <label><input type="checkbox" id="toggleAll" checked> <span id="count"></span></label>
      <span><button id="replaceAll" hidden title="Update the description of every 'likely' Wallet record to the bank's">Replace</button> <button id="compare" title="Show how Wallet's records and the bank's were read">Compare</button> <button id="preview">Preview payload</button></span>
    </div>
    <ul id="list"></ul>
    <div class="actions"><button class="primary grow" id="sync">Add to Wallet</button></div>
    <pre id="payload" hidden></pre>
  </section>

  <script type="module" src="popup.js"></script>
</body></html>
